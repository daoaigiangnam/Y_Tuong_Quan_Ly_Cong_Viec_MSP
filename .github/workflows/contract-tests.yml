name: Contract Module Tests

on:
  push:
    branches:
      - feature/php-mysql-msp-platform
    paths:
      - 'app/contract_policy.php'
      - 'app/services/ContractService.php'
      - 'app/services/ContractAlertService.php'
      - 'public/contract.php'
      - 'tests/contract_validation_test.php'
      - 'tests/contract_service_mysql_test.php'
      - 'database/schema.sql'
      - 'docs/15_Module_07_Contract_Management.md'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'app/contract_policy.php'
      - 'app/services/ContractService.php'
      - 'app/services/ContractAlertService.php'
      - 'public/contract.php'
      - 'tests/contract_validation_test.php'
      - 'tests/contract_service_mysql_test.php'
      - 'database/schema.sql'
      - 'docs/15_Module_07_Contract_Management.md'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: msp_itsm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          for f in app/contract_policy.php app/services/ContractService.php app/services/ContractAlertService.php public/contract.php tests/contract_validation_test.php tests/contract_service_mysql_test.php; do
            php -l "$f"
          done

      - name: Install database schema
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/schema.sql

      - name: Contract validation tests
        run: php tests/contract_validation_test.php

      - name: Contract MySQL integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: msp_itsm
          DB_USER: root
          DB_PASS: root
        run: php tests/contract_service_mysql_test.php

      - name: Regression PHP lint
        shell: bash
        run: |
          set -e
          find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
