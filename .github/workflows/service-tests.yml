name: Service Module Tests
on:
  push:
  pull_request:
jobs:
  service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP lint - service module
        run: php -l public/service.php
      - name: Service validation tests
        run: php tests/service_validation_test.php
