name: Task Module Tests

on:
  push:
    branches:
      - feature/php-mysql-msp-platform
    paths:
      - 'app/task_policy.php'
      - 'app/services/TaskService.php'
      - 'tests/task_validation_test.php'
      - 'tests/task_service_mysql_test.php'
      - 'tests/task_ui_smoke_test.php'
      - 'database/migrations/009_task_management.sql'
      - 'public/tasks.php'
      - 'docs/18_Module_09_Task_Management.md'
      - 'docs/20_Module_09_Task_UI_UX.md'
      - '.github/workflows/task-tests.yml'
  pull_request:
    paths:
      - 'app/task_policy.php'
      - 'app/services/TaskService.php'
      - 'tests/task_validation_test.php'
      - 'tests/task_service_mysql_test.php'
      - 'tests/task_ui_smoke_test.php'
      - 'database/migrations/009_task_management.sql'
      - 'public/tasks.php'
      - 'docs/18_Module_09_Task_Management.md'
      - 'docs/20_Module_09_Task_UI_UX.md'
      - '.github/workflows/task-tests.yml'
  workflow_dispatch:

jobs:
  task-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: msp_itsm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          for f in app/task_policy.php app/services/TaskService.php tests/task_validation_test.php tests/task_service_mysql_test.php tests/task_ui_smoke_test.php public/tasks.php; do
            php -l "$f"
          done

      - name: Install database schema
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/schema.sql

      - name: Apply customer/user migration
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/migrations/002_customer_user.sql

      - name: Apply ticket hardening migration
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/migrations/003_ticket_request_hardening.sql

      - name: Apply task migration
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/migrations/009_task_management.sql

      - name: Seed reference data
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -u root msp_itsm < database/seed.sql

      - name: Task policy validation tests
        run: php tests/task_validation_test.php

      - name: Task MySQL integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: msp_itsm
          DB_USER: root
          DB_PASS: root
        run: php tests/task_service_mysql_test.php

      - name: Task UI smoke test
        run: php tests/task_ui_smoke_test.php

      - name: Regression PHP lint
        shell: bash
        run: |
          set -e
          find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
