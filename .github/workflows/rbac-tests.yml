name: User Role Permission Tests

on:
  push:
    branches:
      - feature/php-mysql-msp-platform
  pull_request:
    branches:
      - feature/php-mysql-msp-platform

jobs:
  rbac-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHP Lint
        run: |
          set -e
          find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: RBAC Validation Tests
        run: php tests/rbac_validation_test.php

      - name: Regression — Customer / Service / Contract / SLA files
        run: |
          set -e
          php -l public/customer.php
          php -l public/service.php
          php -l public/contract.php
          php -l public/sla.php
          php -l app/rbac_policy.php
